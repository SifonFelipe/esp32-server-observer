[env:lilygo-t-display]
platform = espressif32
board = lilygo-t-display
framework = arduino

monitor_speed = 115200
upload_speed = 115200

lib_deps =
    bodmer/TFT_eSPI
    bblanchon/ArduinoJson

build_flags =
    -D USER_SETUP_LOADED
    -D ST7789_DRIVER
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_BL=4
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D SPI_FREQUENCY=40000000
